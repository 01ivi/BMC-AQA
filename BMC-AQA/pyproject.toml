[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmc-aqa"
version = "0.1.0"
description = "Prompt-annotated retrieval, feature calibration, and hierarchical experts for incomplete multimodal AQA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bmc_aqa*"]

